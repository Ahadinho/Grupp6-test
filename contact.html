<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Simple Navigation to jump between pages -->
    <nav style="display: flex; gap: 15px; justify-content: center; padding: 15px; background: rgba(0,0,0,0.1);">
        <a href="index.html" style="text-decoration: none; font-weight: bold; color: #e6e6e6;">Home</a>
        <a href="contact.html" style="text-decoration: none; font-weight: bold; color: #e6e6e6;">Contact Us</a>
    </nav>

    <!-- The required Form Component -->
    <main class="mobile" style="margin-top: 40px;">
        <h1>Contact us</h1>
        
       <form style="display: flex; flex-direction: column; gap: 15px; align-items: center; text-align: center; width: 100%; max-width: 100%; box-sizing: border-box;">
    
    <!-- Namn Box -->
    <div style="width: 100%; box-sizing: border-box;">
        <label for="name" style="font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px;">Namn:</label>
        <input type="text" id="name" style="width: 100%; max-width: 280px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; display: inline-block;" required>
    </div>
    
    <!-- E-post Box -->
    <div style="width: 100%; box-sizing: border-box;">
        <label for="email" style="font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px;">E-post:</label>
        <input type="email" id="email" style="width: 100%; max-width: 280px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; display: inline-block;" required>
    </div>
    
    <!-- Meddelande Box -->
    <div style="width: 100%; box-sizing: border-box;">
        <label for="msg" style="font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px;">Meddelande:</label>
        <textarea id="msg" rows="4" style="width: 100%; max-width: 280px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; resize: none; font-family: inherit; display: inline-block; vertical-align: top; margin: 0;"></textarea>
    </div>
    
    <!-- Button -->
    <button type="submit" style="width: 100%; max-width: 280px; padding: 12px; background-color: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 5px;">Skicka</button>

<div class="mobile">
 
<p>
    Öppettider
    <br>
    Mån-Fre: 08:00-22:00
    <br>
    Lör-Sön: Stängt
</p>
 
</div>
</form>

    </main>

    <!-- Socials Footer -->
    <footer>
        <hr>
        <div style="display: flex; gap: 20px; justify-content: center; padding: 20px 0;">
            <a href="https://twitter.com" target="_blank" style="color: #1DA1F2;">[Twitter]</a>
            <a href="https://facebook.com" target="_blank" style="color: #1877F2;">[Facebook]</a>
            <a href="https://youtube.com" target="_blank" style="color: #FF0000;">[YouTube]</a>
            <a href="https://instagram.com" target="_blank" style="color: #E4405F;">[Instagram]</a>
        </div>
    </footer>

</body>
</html>
